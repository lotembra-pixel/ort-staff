<head>

<script>
const API_BASE = '';
const APP_TOKEN = '__APP_TOKEN__'; // injected by server at load time – never in source files
let _sseSource = null;
const _sseCbs = {};
function startSSE(paths) {
  if (_sseSource) _sseSource.close();
  const url = API_BASE + '/api/stream?token=' + encodeURIComponent(APP_TOKEN) + '&paths=' + paths.map(encodeURIComponent).join(',');
  _sseSource = new EventSource(url);
  _sseSource.onmessage = e => {
    const { path, data } = JSON.parse(e.data);
    (_sseCbs[path] || []).forEach(cb => cb(data));
  };
}
</script>
<style>
:root{--navy:#2c4a96;--mag:#b02a6a;--bg:linear-gradient(145deg,#0d1b4b 0%,#1a2a6e 45%,#2c1654 100%);--card-bg:rgba(255,255,255,.08);--card-border:rgba(255,255,255,.22);--text:#fff;--muted:rgba(255,255,255,.5);--dim:rgba(255,255,255,.3);--topbar:rgba(13,27,75,.95);--nav:rgba(13,27,75,.97);--inp-bg:rgba(255,255,255,.1);--inp-border:rgba(255,255,255,.2);--inp-color:#fff;}
body.light{--bg:linear-gradient(145deg,#dce8ff 0%,#eef3ff 45%,#f3e8ff 100%);--card-bg:rgba(255,255,255,.75);--card-border:rgba(100,120,200,.3);--text:#1a1a2e;--muted:rgba(30,30,80,.55);--dim:rgba(30,30,80,.35);--topbar:rgba(220,232,255,.96);--nav:rgba(220,232,255,.98);--inp-bg:rgba(255,255,255,.7);--inp-border:rgba(44,74,150,.25);--inp-color:#1a1a2e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;direction:rtl;transition:background .35s;}
input,textarea,select{font-family:'Assistant',sans-serif;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseM{0%,100%{box-shadow:0 0 0 0 rgba(176,42,106,.5)}70%{box-shadow:0 0 0 14px rgba(176,42,106,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}
@keyframes heartPop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(176,42,106,.4)}50%{box-shadow:0 0 28px rgba(176,42,106,.9),0 0 50px rgba(176,42,106,.4)}}
@keyframes mineCell{0%,100%{box-shadow:0 0 0 0 rgba(176,42,106,.7)}50%{box-shadow:0 0 0 5px rgba(176,42,106,0)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.glass{background:var(--card-bg);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid var(--card-border);border-radius:20px;box-shadow:0 8px 32px rgba(44,74,150,.15);}
.btn{font-family:'Assistant',sans-serif;cursor:pointer;border:none;transition:transform .1s;font-weight:800;}
.btn:active{transform:scale(.94);}
.card-btn{border-radius:22px;padding:20px 14px;text-align:center;color:#fff;border:none;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;}
.card-btn:active{transform:scale(.94);}
.card-btn .icon{font-size:34px;margin-bottom:6px;display:block;}
.card-btn .title{font-size:16px;font-weight:900;}
.card-btn .sub{font-size:10px;opacity:.75;margin-top:3px;display:block;}
.card-btn.af .icon{animation:floatY 2.8s ease-in-out infinite;}
.card-btn.ap .icon{animation:heartPop 1.2s ease-in-out infinite;}
.card-btn.ap{animation:glowPulse 2s ease-in-out infinite;}
.card-btn.ap::before,.card-btn.ap::after{content:"✨";position:absolute;font-size:14px;animation:sparkle 1.4s ease-in-out infinite;}
.card-btn.ap::before{top:8px;right:10px;animation-delay:.2s;}
.card-btn.ap::after{bottom:8px;left:10px;animation-delay:.7s;}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none;}
.duty-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.duty-table{width:100%;border-collapse:separate;border-spacing:2px;background:#fff;border-radius:14px;overflow:hidden;}
.duty-table th{background:#2c4a96;color:#fff;font-size:11px;padding:6px 4px;text-align:center;font-weight:800;}
.duty-table td{background:#f8f9ff;color:#1a1a2e;font-size:11px;padding:6px 5px;text-align:center;font-weight:600;border:1px solid #e2e8f0;min-width:58px;}
.duty-table td.sc{background:#eef2ff;color:#2c4a96;font-weight:700;text-align:right;padding-right:8px;min-width:120px;}
.duty-table td.tc{background:#fce7f3;color:#9d174d;font-weight:800;}
.duty-table td.mc{background:#b02a6a;color:#fff!important;font-weight:900;border-radius:6px;animation:mineCell 2s ease-in-out infinite;}
.duty-table tr:hover td{background:#f0f4ff;}
.pc{background:#fff;color:#1a1a2e;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 16px rgba(44,74,150,.15);border:1px solid #e2e8f0;}
.pc .dl{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.pc .ll{font-size:16px;font-weight:800;color:#1a1a2e;}
.pc.today{border:2px solid var(--mag);}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--inp-border);background:var(--inp-bg);color:var(--inp-color);font-size:15px;outline:none;margin-bottom:10px;}
.inp-sm{width:100%;padding:8px 10px;font-size:13px;border-radius:10px;border:1px solid var(--inp-border);background:var(--inp-bg);color:var(--inp-color);outline:none;margin-bottom:8px;}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700;display:block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.badge{font-size:11px;border-radius:20px;padding:2px 9px;font-weight:800;display:inline-block;}
.sn{background:rgba(107,114,128,.25);border:1px solid #6b728088;color:#9ca3af;}
.sb{background:rgba(44,74,150,.3);border:1px solid var(--navy);color:#93c5fd;}
.sd{background:rgba(16,185,129,.2);border:1px solid #10b98188;color:#4ade80;}
#topbar{position:sticky;top:0;z-index:100;background:var(--topbar);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border);padding:8px 14px;display:flex;align-items:center;gap:8px;}
#bottomnav{position:fixed;bottom:0;right:0;left:0;max-width:480px;margin:0 auto;background:var(--nav);backdrop-filter:blur(20px);border-top:1px solid var(--card-border);display:flex;z-index:99;}
.nb{flex:1;padding:10px 0;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px;cursor:pointer;font-family:'Assistant',sans-serif;border-top:2px solid transparent;transition:color .2s,border-color .2s;}

#app{padding-bottom:80px;}
.screen{display:none;padding:14px 14px 0;animation:fadeUp .25s ease;}
.screen.active{display:block;}
#modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;}
#modal-overlay.open{display:flex;}
#modal-box{background:linear-gradient(145deg,#1a2a6e,#2c1654);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:24px;width:100%;max-width:400px;animation:popIn .2s ease;max-height:90vh;overflow-y:auto;}
#toast{position:fixed;top:80px;left:16px;right:16px;z-index:998;max-width:448px;margin:0 auto;background:linear-gradient(135deg,#10b981,#059669);border-radius:14px;padding:14px 18px;font-size:14px;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;animation:fadeUp .3s ease;}
#login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.skel{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.06) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;margin-bottom:12px;}
.dev-credit{background:linear-gradient(135deg,var(--navy),var(--mag));border-radius:12px;padding:8px 16px;text-align:center;font-size:13px;font-weight:800;color:#fff;letter-spacing:.3px;margin-bottom:14px;box-shadow:0 4px 14px rgba(176,42,106,.4);}
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;padding:11px 40px 11px 14px;border-radius:14px;border:1px solid var(--inp-border);background:var(--inp-bg);color:var(--inp-color);font-size:14px;outline:none;font-family:'Assistant',sans-serif;}
.search-wrap .si{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}
</style>
</head>

<script>

/* ── Confetti ── */
function launchConfetti(){
  const canvas=document.getElementById("confetti-canvas");canvas.style.display="block";
  const ctx=canvas.getContext("2d");canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const pieces=[],colors=["#f59e0b","#b02a6a","#6366f1","#10b981","#f97316","#06b6d4","#ec4899","#84cc16"];
  for(let i=0;i<120;i++)pieces.push({x:Math.random()*canvas.width,y:-20,r:Math.random()*8+4,color:colors[~~(Math.random()*colors.length)],vx:(Math.random()-.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,vr:(Math.random()-.5)*8,shape:Math.random()>.5?"rect":"circle"});
  let frame=0;
  (function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.globalAlpha=.85;p.shape==="rect"?ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r):(ctx.beginPath(),ctx.arc(0,0,p.r,0,Math.PI*2),ctx.fill());ctx.restore();p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=.05;});if(++frame<180)requestAnimationFrame(draw);else{ctx.clearRect(0,0,canvas.width,canvas.height);canvas.style.display="none";}})();
}

/* ── App kill switch ── */
const KILL_HASH="e851d7cf2dd4a7059f3e9eb09891acd148bad32d93c3227bf6e9c7b65221df27";

async function hashStr(s){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}

/* ── Sync ── */
function startSync(){
  showSkeleton("dash");
  let sL=false,cL=false,fL=false;
  function check(){if(sL&&cL&&fL&&!_dataLoaded){_dataLoaded=true;renderScreen(curScreen);}}
  const personalPath="personalDuties/"+session.name.replace(/\s+/g,"_");
  fbListen("settings",d=>{appData.settings=d||{schoolName:SCHOOL_NAME,slogan:"אנחנו רואים אותך 💙"};const sub=document.getElementById("topbar-sub");if(sub)sub.textContent=appData.settings.slogan;sL=true;check();if(_dataLoaded&&curScreen==="dash")renderDash();});

  fbListen("faults",d=>{appData.faults=d?Object.entries(d).map(([k,v])=>({...v,_key:k})):[];fL=true;check();if(_dataLoaded&&(curScreen==="faults"||curScreen==="dash"))renderScreen(curScreen);});
  fbListen("sharedBoard",d=>{appData.sharedBoard=d?Object.entries(d).map(([k,v])=>({...v,_key:k})):[];if(_dataLoaded&&curScreen==="board")renderBoard();});
  fbListen("praises",d=>{
    const today=todayStr();const all=d?Object.entries(d).map(([k,v])=>({...v,_key:k})):[];
    all.forEach(p=>{if(p.dateKey&&p.dateKey!==today)fbDel("praises/"+p._key);});
    appData.praises=all.filter(p=>!p.dateKey||p.dateKey===today);
    if(_dataLoaded&&curScreen==="praise")renderPraise();if(_dataLoaded&&curScreen==="dash")renderDash();
  });
  fbListen("dutyOverride",d=>{appData.dutyOverride=d||{};if(_dataLoaded&&(curScreen==="duty"||curScreen==="admin"))renderScreen(curScreen);});
  fbListen("dutyNotes",d=>{appData.dutyNotes=d||{};if(_dataLoaded&&curScreen==="duty")renderDuty();});
  fbListen("techInfo",d=>{appData.techInfo=d||{wifi:[{name:"MadeM-TeacheR",password:"MadeM-2022"}],copier:[],gates:[]};if(_dataLoaded&&curScreen==="tech")renderTech();});
  fbListen(personalPath,d=>{appData.myPersonalDuties=d?Object.entries(d).map(([k,v])=>({...v,_key:k})):[];if(_dataLoaded&&curScreen==="duty")renderDuty();});
  startSSE(["settings","contacts","faults","sharedBoard","praises","dutyOverride","dutyNotes","techInfo",personalPath]);
}

/* ══ LOGIN ══ */
function showLS(step){["init","setpass","ret"].forEach(s=>{const el=document.getElementById("ls-"+s);if(el)el.style.display=s===step?"block":"none";});}
function togglePass(id,btn){const el=document.getElementById(id);el.type=el.type==="password"?"text":"password";btn.textContent=el.type==="password"?"👁":"🙈";}
let _lname="",_lemail="";

async function loginInit(){
  const cb=document.getElementById("terms-cb");
  if(cb&&!cb.checked)return showErr("li-err","יש לאשר את תנאי השימוש כדי להמשיך");

  /* Kill/Revive toggle – same code */
  const passVal=document.getElementById("li-pass").value;
  if(passVal&&await checkKill(passVal)){
    const killed=lsGet("ort_killed",false);
    if(killed){lsSet("ort_killed",false);location.reload();}
    else{lsSet("ort_killed",true);showKilled();}
    return;
  }

  const email=document.getElementById("li-email").value.trim();
  const fullName=document.getElementById("li-name").value.trim();
  const pass=document.getElementById("li-pass").value;
  document.getElementById("li-err").style.display="none";

  if(!email)return showErr("li-err","נא להזין כתובת מייל ארגונית");
  if(!email.includes("@"))return showErr("li-err","כתובת המייל אינה תקינה");
  if(!isOrgEmail(email))return showErr("li-err","הכניסה מותרת עם מייל ארגוני בלבד");
  if(!fullName)return showErr("li-err","נא להזין שם מלא");

  _lemail=email;
  _lname=fullName;

  /* Admin code */
  if(pass===ADMIN_CODE){
    const isAdm=ADMIN_USERS.some(a=>fullName.includes(a.split(" ")[0]));
    enterApp({name:fullName,email,isAdmin:true,isMaint:false,isHQ:isAdm});
    return;
  }

  if(!pass)return showErr("li-err","נא להזין קוד גישה");

  const key="ort_u_"+fullName.replace(/[\s.@]/g,"_");
  if(lsGet(key,null)){
    document.getElementById("li-greet2").textContent=`ברוכה הבאה חזרה! 😊`;
    showLS("ret");
  } else {
    document.getElementById("li-greet").textContent=`שלום! 👋`;
    showLS("setpass");
  }
}

function loginSetPass(){
  const np=document.getElementById("li-np").value,np2=document.getElementById("li-np2").value;
  document.getElementById("li-err2").style.display="none";
  if(np.length<4)return showErr("li-err2","סיסמה חייבת להיות לפחות 4 תווים");
  if(np!==np2)return showErr("li-err2","הסיסמאות אינן תואמות");
  const key="ort_u_"+_lname.replace(/[\s.@]/g,"_");
  lsSet(key,{pass:np,email:_lemail});
  enterApp({name:_lname,email:_lemail,isAdmin:false,isMaint:false,isHQ:false});
}

function loginReturn(){
  document.getElementById("li-err3").style.display="none";
  const key="ort_u_"+_lname.replace(/[\s.@]/g,"_");
  const stored=lsGet(key,null);
  if(!stored)return showErr("li-err3","משתמש לא נמצא");
  const rp=document.getElementById("li-rp").value;
  if(stored.pass&&rp!==stored.pass)return showErr("li-err3","סיסמה שגויה");
  enterApp({name:_lname,email:_lemail,isAdmin:false,isMaint:false,isHQ:false});
}

function showErr(id,msg){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.display="block";}}

function enterApp(sess){
  session=sess;lsSet("ort_session",sess);
  document.getElementById("login-screen").style.display="none";
  document.getElementById("main-app").style.display="block";
  if(sess.isAdmin||sess.isHQ||canAdmin())document.getElementById("admin-nav-btn").style.display="flex";

}

})();

/* ══ DUTY ══ */
function parseBreakMins(t){const p=t.split("–");function m(s){const[h,mm]=s.trim().split(":");return+h*60+(+mm||0);}return{start:m(p[0]),end:m(p[1]||p[0])};}
function getCountdownHTML(){
  const today=new Date().getDay(),tc=today>=0&&today<=4?today:-1;if(tc<0)return"";
  const now=new Date(),cur=now.getHours()*60+now.getMinutes();
  const myB=[];SCHEDULE.breaks.forEach(br=>{SCHEDULE.stations.forEach((_,si)=>{if(isMyName(getCell(br.id,si,tc))&&!myB.find(x=>x.id===br.id))myB.push(br);});});
  if(!myB.length)return"";
  for(const br of myB){
    const{start,end}=parseBreakMins(br.time);
    if(cur>=start&&cur<end)return`<div style="margin-bottom:12px;background:linear-gradient(135deg,rgba(176,42,106,.35),rgba(44,74,150,.35));border:1px solid rgba(176,42,106,.5);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px"><span style="font-size:22px">🔴</span><div><div style="font-size:13px;font-weight:900;color:#f9a8d4">את/ה בתורנות עכשיו!</div><div style="font-size:11px;color:rgba(255,255,255,.6)">${br.label} · ${br.time}</div></div></div>`;
    if(cur<start){const mm=String(start-cur).padStart(2,"0");return`<div style="margin-bottom:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px"><span style="font-size:22px">⏱️</span><div><div style="font-size:13px;font-weight:900;color:#fbbf24">ההפסקה הבאה שלך בעוד: ${mm} דקות</div><div style="font-size:11px;color:rgba(255,255,255,.6)">${br.label} · ${br.time}</div></div></div>`;}
  }
  return"";
}

function dutySearch(q){
  _dutyQ=q.trim().toLowerCase();
  const el=document.getElementById("duty-search-results");
  if(!el)return;
  if(!_dutyQ){el.innerHTML="";return;}

  const res=[];
  SCHEDULE.breaks.forEach(br=>{
    SCHEDULE.stations.forEach((st,si)=>{
      [0,1,2,3,4].forEach(di=>{
        const v=getCell(br.id,si,di);
        if(v&&v.toLowerCase().includes(_dutyQ)){
          res.push({br,st,day:DAY_NAMES[di],name:v,isMe:isMyName(v)});
        }
      });
    });
  });

  if(!res.length){el.innerHTML=`<div style="text-align:center;padding:14px 0;color:var(--dim);font-size:13px">לא נמצאו תוצאות</div>`;return;}
  el.innerHTML=res.slice(0,20).map(r=>`<div style="padding:10px 12px;border-radius:10px;margin-bottom:6px;background:${r.isMe?"rgba(176,42,106,.2)":"rgba(255,255,255,.05)"};border:1px solid ${r.isMe?"var(--mag)":"rgba(255,255,255,.1)"}"><div style="font-size:12px;color:var(--muted)">${r.br.label} · ${r.br.time} · יום ${r.day}</div><div style="font-size:13px;font-weight:700;color:${r.isMe?"#f9a8d4":"#fff"}">${r.name}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${r.st}</div></div>`).join("");
}

        </div>`;
      });
      if(rows)html+=`<div class="glass" style="padding:12px 14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-size:13px;font-weight:800;color:#fbbf24">${br.label}</div><div style="font-size:11px;color:rgba(255,255,255,.5)">${br.time}</div></div>${rows}</div>`;

  }
  html+=`</div>`;

  html+=`<div id="dt-full" style="display:none"><div style="font-size:13px;font-weight:900;color:rgba(255,255,255,.7);margin-bottom:12px">📊 לוח תורנויות שנתי</div>
    ${SCHEDULE.breaks.map(br=>`<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:800;color:#fbbf24;margin-bottom:6px">${br.label} · ${br.time}</div><div class="duty-table-wrap"><table class="duty-table"><thead><tr><th style="text-align:right;padding-right:8px">עמדה</th>${DAY_NAMES.map((d,i)=>`<th style="${i===tc?"background:#b02a6a":""}">${d}</th>`).join("")}</tr></thead><tbody>${SCHEDULE.stations.map((st,si)=>`<tr><td class="sc">${si+1}. ${st}</td>${[0,1,2,3,4].map(di=>{const v=getCell(br.id,si,di);return`<td class="${isMyName(v)?"mc":di===tc?"tc":""}">${v||""}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}

function switchDTab(t){
  ["myduty","full","personal"].forEach(k=>{
    const c=document.getElementById("dt-"+k);if(c)c.style.display=k===t?"block":"none";
    const b=document.getElementById("dtab-"+k);if(b){b.style.background=k===t?"linear-gradient(135deg,var(--navy),var(--mag))":"rgba(255,255,255,.08)";b.style.border=k===t?"none":"1px solid rgba(255,255,255,.15)";}
  });
}
function renderPersonalList(){
  const list=appData.myPersonalDuties||[];const today=new Date().getDay();
  if(!list.length)return`<div style="text-align:center;padding:24px 0;color:rgba(255,255,255,.35);font-size:14px">עדיין לא הוספת תורנויות אישיות</div>`;
  return list.map(p=>{
    const isT=+p.day===today;
    const ds=new Date().toISOString().split("T")[0].replace(/-/g,"");
    const pts=(p.time||"09:00").split(":");
    const hh=(pts[0]||"09").padStart(2,"0"),mm=(pts[1]||"00").padStart(2,"0");
    const endH=String(+hh+Math.floor((+mm+20)/60)).padStart(2,"0"),endM=String((+mm+20)%60).padStart(2,"0");
    const calUrl=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("תורנות – "+(p.location||""))}&dates=${ds}T${hh}${mm}00/${ds}T${endH}${endM}00&details=${encodeURIComponent("תורנות: "+(p.location||""))}&ctz=Asia/Jerusalem`;
    return`<div class="pc ${isT?"today":""}"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1"><div class="dl">יום ${DAY_NAMES[+p.day]||""} · ${p.time||""}${isT?`<span style="background:var(--mag);color:#fff;border-radius:10px;padding:1px 8px;font-size:10px;margin-right:6px">היום!</span>`:""}</div><div class="ll">${p.location||""}</div></div><div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end"><a href="${calUrl}" target="_blank" style="text-decoration:none"><button class="btn" style="background:linear-gradient(135deg,var(--navy),#4338ca);border-radius:8px;padding:7px 11px;color:#fff;font-size:12px;white-space:nowrap">📅 יומן</button></a><button class="btn" onclick="delPersonalDuty('${p._key}')" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:6px 10px;color:#e53e3e;font-size:12px">🗑</button></div></div></div>`;
  }).join("");
}
async function addPersonalDuty(){const day=document.getElementById("pd-day")?.value,time=document.getElementById("pd-time")?.value.trim(),loc=document.getElementById("pd-loc")?.value.trim();if(!time||!loc){toast("⚠️ נא למלא שעה ומיקום");return;}try{await fbPush("personalDuties/"+session.name.replace(/\s+/g,"_"),{day:+day,time,location:loc});toast("✅ התורנות נשמרה!");}catch(e){toast("❌ "+e.message);}}
function delPersonalDuty(key){fbDel("personalDuties/"+session.name.replace(/\s+/g,"_")+"/"+key);}
function saveDutyNote(brId,si,tc){const el=document.getElementById(`note-${brId}-${si}`);if(!el)return;fbPatch("dutyNotes",{[`note_${brId}_${si}_${tc}`]:el.value.trim()});toast("💾 נשמר!");}
function openSubModal(bk,si){
  const tc=new Date().getDay(),tcc=tc>=0&&tc<=4?tc:-1,cur=tcc>=0?getCell(bk,si,tcc):"";
  openModal(`<div style="font-size:16px;font-weight:900;margin-bottom:14px;text-align:center">🔄 עדכון מחליפה</div><label class="lbl">שם המחליפה</label><input id="sub-name" class="inp" placeholder="שם מלא" value="${cur}"/><button class="btn" onclick="confirmSub('${bk}',${si})" style="width:100%;padding:12px 0;background:linear-gradient(135deg,var(--navy),var(--mag));border-radius:12px;color:#fff;font-size:15px;margin-bottom:8px">✓ עדכן</button><button class="btn" onclick="closeModal()" style="width:100%;padding:10px 0;background:rgba(255,255,255,.08);border-radius:12px;color:rgba(255,255,255,.6);font-size:14px">ביטול</button>`);
}
function confirmSub(bk,si){const val=document.getElementById("sub-name")?.value.trim();const tc=new Date().getDay(),di=tc>=0&&tc<=4?tc:-1;if(di<0){closeModal();return;}fbPatch("dutyOverride",{[`${bk}_${si}_${di}`]:val});closeModal();toast("✅ המחליפה עודכנה!");}

function renderBVax(entries){return`<div class="glass" style="padding:12px;margin-bottom:12px;border:1px solid rgba(16,185,129,.3)"><div class="g2" style="gap:8px"><div><label class="lbl">כיתה *</label><input id="bv-c" class="inp-sm" placeholder="י׳1"/></div><div><label class="lbl">תאריך *</label><input id="bv-d" class="inp-sm" placeholder="01/09/2025"/></div></div><button class="btn" onclick="addBVax()" style="width:100%;padding:10px 0;background:linear-gradient(135deg,#10b981,#059669);border-radius:10px;color:#fff;font-size:14px;margin-top:4px">📢 פרסם</button></div>${entries.map(e=>`<div class="glass" style="padding:12px 16px;margin-bottom:8px;border:1px solid rgba(16,185,129,.2);display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:15px;font-weight:800">כיתה ${e.class||""}</div><div style="font-size:12px;color:#34d399;margin-top:2px">📅 ${e.date||""} · ${e.reporter||""}</div></div>${(session.isAdmin||e.reporter===session.name)?`<button class="btn" onclick="delBE('${e._key}')" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:6px 9px;color:#f87171;font-size:13px">🗑</button>`:""}</div>`).join("")}${entries.length===0?`<div style="text-align:center;padding:10px 0;color:var(--dim)">אין דיווחי חיסונים</div>`:""}`;  }
function addBVax(){const cls=document.getElementById("bv-c")?.value.trim(),date=document.getElementById("bv-d")?.value.trim();if(!cls||!date)return;fbPush("sharedBoard",{cat:"vaccine",class:cls,date,reporter:session.name,ts:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})});}
function renderBFaults(entries){return`<div class="glass" style="padding:12px;margin-bottom:12px"><div style="display:flex;gap:8px;margin-bottom:10px">${["מחשוב","אחזקה"].map(c=>`<button class="btn" id="bfc-${c}" onclick="selBFC('${c}')" style="flex:1;padding:9px 0;border-radius:10px;font-size:13px;background:${c==="מחשוב"?"linear-gradient(135deg,var(--navy),var(--mag))":"rgba(255,255,255,.08)"};color:#fff">${c==="מחשוב"?"💻 מחשוב":"🔨 אחזקה"}</button>`).join("")}</div><label class="lbl">כיתה *</label><input id="bf-c" class="inp-sm" placeholder="כיתה 203"/><label class="lbl">פירוט *</label><textarea id="bf-d" class="inp-sm" style="height:60px;resize:none" placeholder="תאר..."></textarea><div id="bf-n" style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:8px">📲 ישלח לאורי</div><div id="bf-s" style="display:none;font-size:12px;color:#4ade80;text-align:center;margin-bottom:6px;font-weight:700">✅ נשלח!</div><button class="btn" onclick="addBFault()" style="width:100%;padding:10px 0;background:linear-gradient(135deg,var(--mag),#8b1a5a);border-radius:10px;color:#fff;font-size:14px">📢 פרסם ושלח ווצאפ</button></div>${entries.map(e=>`<div class="glass" style="padding:12px 16px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><div style="font-size:14px;font-weight:800">${e.category||""} · כיתה ${e.class||""}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">👩‍🏫 ${e.reporter||""} · ${e.description||""}</div></div>${(session.isAdmin||e.reporter===session.name)?`<button class="btn" onclick="delBE('${e._key}')" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:6px 9px;color:#f87171;font-size:13px">🗑</button>`:""}</div></div>`).join("")}${entries.length===0?`<div style="text-align:center;padding:10px 0;color:var(--dim)">אין תקלות בלוח</div>`:""}`;  }
window._bfc="מחשוב";
function selBFC(c){window._bfc=c;["מחשוב","אחזקה"].forEach(x=>{const b=document.getElementById("bfc-"+x);if(b)b.style.background=x===c?"linear-gradient(135deg,var(--navy),var(--mag))":"rgba(255,255,255,.08)";});const n=document.getElementById("bf-n");if(n)n.textContent=`📲 ישלח ל-${c==="מחשוב"?"אורי":"קוסטיה"}`;}
function addBFault(){const cls=document.getElementById("bf-c")?.value.trim(),desc=document.getElementById("bf-d")?.value.trim();if(!cls||!desc)return;const cat=window._bfc||"מחשוב",ph=cat==="מחשוב"?ORI_PHONE:KOSTIA_PHONE;fbPush("sharedBoard",{cat:"boardFault",category:cat,class:cls,description:desc,reporter:session.name,ts:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})});window.open(`https://wa.me/972${ph.replace(/^0/,"")}?text=${encodeURIComponent(`🔧 תקלה!\nסוג: ${cat}\nכיתה: ${cls}\nתיאור: ${desc}\nמ: ${session.name}`)}`,"_blank");document.getElementById("bf-c").value="";document.getElementById("bf-d").value="";const s=document.getElementById("bf-s");if(s){s.style.display="block";setTimeout(()=>s.style.display="none",3000);}}

/* ══ PRAISE ══ */
function renderPraise(){
  (appData.praises||[]).filter(p=>p.to===session.name&&!p.seen).forEach(p=>fbPatch("praises/"+p._key,{seen:true}));
  const all=appData.praises||[],mine=all.filter(p=>p.to===session.name).slice(0,5),total=all.length;
  document.getElementById("screen-praise").innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><div style="font-size:20px">🗓️</div><div><div style="font-size:13px;font-weight:900;color:#f9a8d4">קיר הפירגון היומי</div><div style="font-size:11px;color:var(--muted)">מתאפס כל יום בחצות · ${total} פירגונים היום</div></div></div>
    <div class="glass" style="padding:18px;margin-bottom:16px;border:1px solid rgba(176,42,106,.4);animation:glowPulse 3s ease-in-out infinite">
      <div style="font-size:16px;font-weight:900;color:#f9a8d4;margin-bottom:12px">💖 שלחי פירגון לעמית ✨</div>
      <label class="lbl">למי?</label><input id="pr-to" class="inp" placeholder="שם העמית..."/>
      <label class="lbl">הודעה</label><textarea id="pr-msg" class="inp" style="resize:none;height:72px" placeholder="כל הכבוד על..."></textarea>
      <div id="pr-sent" style="display:none;font-size:13px;color:#4ade80;text-align:center;margin-bottom:8px;font-weight:700">✅ הפירגון נשלח! 💖🎉</div>
      <button class="btn" onclick="sendPraise()" style="width:100%;padding:13px 0;background:linear-gradient(135deg,var(--mag),#8b1a5a);border-radius:14px;color:#fff;font-size:16px;animation:pulseM 2s infinite">שלחי פירגון 💖</button>
    </div>
    ${mine.length>0?`<div style="font-size:14px;font-weight:900;color:#f9a8d4;margin-bottom:8px">💌 פירגונים שקיבלת היום</div>${mine.map(p=>`<div class="glass" style="padding:13px 16px;margin-bottom:8px;border:1px solid rgba(176,42,106,.4);background:rgba(176,42,106,.1)"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">מ-${p.from||""} · ${p.ts||""}</div><div style="font-size:14px;font-weight:700;line-height:1.5">"${p.msg||""}"</div></div>`).join("")}`:""}
    ${all.length>0?`<div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px;margin-top:4px">📋 כל הפירגונים של היום</div>${all.slice(0,30).map(p=>`<div class="glass" style="padding:11px 14px;margin-bottom:6px;border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:var(--muted);margin-bottom:2px">💖 ${p.from||""} → ${p.to||""} · ${p.ts||""}</div><div style="font-size:13px">${p.msg||""}</div></div>`).join("")}`:`<div style="text-align:center;padding:24px 0;color:var(--dim)">עדיין אין פירגונים היום 💖<br><span style="font-size:12px">היי הראשונה לפרגן!</span></div>`}`;
}
function sendPraise(){
  const to=document.getElementById("pr-to")?.value.trim(),msg=document.getElementById("pr-msg")?.value.trim();if(!to||!msg)return;
  const now=new Date();
  fbPush("praises",{from:session.name,to,msg,dateKey:todayStr(),ts:now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),seen:false});
  document.getElementById("pr-to").value="";document.getElementById("pr-msg").value="";
  launchConfetti();
  const s=document.getElementById("pr-sent");if(s){s.style.display="block";setTimeout(()=>s.style.display="none",4000);}
}

/* ══ ADMIN ══ */
let _aTab="board";
function renderAdmin(){
  if(!canAdmin()&&!session.isAdmin){document.getElementById("screen-admin").innerHTML=`<div style="text-align:center;padding:40px 0;color:var(--dim)">⛔ אין הרשאה</div>`;return;}
  const today=new Date().getDay(),tc=today>=0&&today<=4?today:-1;
  document.getElementById("screen-admin").innerHTML=`<div style="background:rgba(245,158,11,.08);border-bottom:1px solid rgba(245,158,11,.12);padding:10px 0 0;margin:-14px -14px 14px"><div style="display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto">${[{k:"board",l:"📋 לוח תורנויות"},{k:"contacts",l:"📱 אנשי קשר"},{k:"school",l:"🏫 הגדרות"}].map(t=>`<button class="btn" data-atab="${t.k}" onclick="swATab('${t.k}')" style="background:rgba(255,255,255,.08);border-radius:12px;padding:8px 14px;color:#fff;font-size:13px;white-space:nowrap">${t.l}</button>`).join("")}</div></div><div id="admin-content">${renderATab(_aTab,tc)}</div>`;
  swATab(_aTab);
}
function swATab(t){_aTab=t;const today=new Date().getDay(),tc=today>=0&&today<=4?today:-1;document.querySelectorAll("[data-atab]").forEach(b=>{b.style.background=b.dataset.atab===t?"linear-gradient(135deg,#f59e0b,#d97706)":"rgba(255,255,255,.08)";});const c=document.getElementById("admin-content");if(c)c.innerHTML=renderATab(t,tc);}
function renderATab(t,tc){if(t==="board")return renderAdminBoard(tc);if(t==="contacts"){renderContacts();return document.getElementById("screen-contacts").innerHTML||"";}if(t==="school")return`<div class="glass" style="padding:18px"><div style="font-size:15px;font-weight:900;color:#fbbf24;margin-bottom:14px">🏫 פרטי בית הספר</div><label class="lbl">שם בית הספר</label><input id="as-n" class="inp" value="${appData.settings?.schoolName||""}"/><label class="lbl">סלוגן</label><input id="as-s" class="inp" value="${appData.settings?.slogan||""}"/><button class="btn" onclick="saveSchool()" style="width:100%;padding:12px 0;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:12px;color:#fff;font-size:14px">שמור ✓</button></div>`;return"";}
function saveSchool(){fbPatch("settings",{schoolName:document.getElementById("as-n")?.value.trim(),slogan:document.getElementById("as-s")?.value.trim()});toast("✅ נשמר!");}
function renderAdminBoard(tc){return`<div style="font-size:13px;font-weight:900;color:#fbbf24;margin-bottom:12px">👑 עריכת לוח תורנויות</div><div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">${SCHEDULE.breaks.map(b=>`<button class="btn" id="abk-${b.id}" onclick="selABk('${b.id}')" style="padding:8px 12px;border-radius:12px;font-size:11px;white-space:nowrap;background:${b.id===(window._abk||"a")?"linear-gradient(135deg,var(--navy),var(--mag))":"rgba(255,255,255,.1)"};color:#fff">${b.label}<br><span style="font-size:9px;opacity:.7">${b.time}</span></button>`).join("")}</div><div id="admin-break-tbl">${renderABkTable(window._abk||"a",tc)}</div>`;}
window._abk="a";
function selABk(id){window._abk=id;const tc=new Date().getDay();SCHEDULE.breaks.forEach(b=>{const btn=document.getElementById("abk-"+b.id);if(btn)btn.style.background=b.id===id?"linear-gradient(135deg,var(--navy),var(--mag))":"rgba(255,255,255,.1)";});const tbl=document.getElementById("admin-break-tbl");if(tbl)tbl.innerHTML=renderABkTable(id,tc>=0&&tc<=4?tc:-1);}
function renderABkTable(bk,tc){return`<div class="duty-table-wrap"><table class="duty-table"><thead><tr><th style="text-align:right;padding-right:8px">עמדה</th>${DAY_NAMES.map((d,i)=>`<th style="${i===tc?"background:#b02a6a":""}">${d}</th>`).join("")}</tr></thead><tbody>${SCHEDULE.stations.map((st,si)=>`<tr><td class="sc">${si+1}. ${st}</td>${[0,1,2,3,4].map(di=>{const v=getCell(bk,si,di);return`<td class="${isMyName(v)?"mc":di===tc?"tc":""}" onclick="adminEditCell('${bk}',${si},${di},'${v.replace(/'/g,"&#39;")}')" style="cursor:pointer">${v||""}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div><div style="font-size:10px;color:var(--dim);text-align:center;margin-top:8px">לחצי על תא לעריכה</div>`;}
function adminEditCell(bk,si,di,cur){openModal(`<div style="font-size:15px;font-weight:900;margin-bottom:14px;text-align:center">✏️ עריכת תא</div><div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:10px;text-align:center">${SCHEDULE.breaks.find(b=>b.id===bk)?.label} · ${SCHEDULE.stations[si]}</div><label class="lbl">שם המורה</label><input id="ac-v" class="inp" value="${cur}" placeholder="שם מורה"/><button class="btn" onclick="saveACell('${bk}',${si},${di})" style="width:100%;padding:12px 0;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:12px;color:#fff;font-size:15px;margin-bottom:8px">שמור ✓</button><button class="btn" onclick="closeModal()" style="width:100%;padding:10px 0;background:rgba(255,255,255,.08);border-radius:12px;color:rgba(255,255,255,.6);font-size:14px">ביטול</button>`);}
function saveACell(bk,si,di){const v=document.getElementById("ac-v")?.value||"";fbPatch("dutyOverride",{[`${bk}_${si}_${di}`]:v});closeModal();toast("✅ עודכן!");selABk(window._abk||"a");}
</script>
</body>
</html>
